  "La luz de carretera se cambia a cruce en cuanto hay riesgo de deslumbrar, y no se recupera hasta haber rebasado el cruce.",
  ["A esa altura aún no ha terminado el cruce.", "Antes del cruce deslumbraría al otro conductor."],
  "Largas otra vez, solo después del cruce.");
Q("luces", null, "Va con luz larga detrás de otro vehículo, en el mismo sentido. ¿Debe cambiarla por la de cruce?",
  ["Sí, si puede deslumbrar a su conductor a través del retrovisor.", "No, solo se cambia con el tráfico de frente.", "No, si la carretera no está iluminada."],
  "Hay que evitar el deslumbramiento también a quien circula en el mismo sentido, que puede sufrirlo por el retrovisor.",
  ["La obligación también protege a quien circula delante en el mismo sentido.", "La vía sin luz no le autoriza a deslumbrar."],
  "Delante también se deslumbra: retrovisor.");
Q("luces", null, "¿En cuál de estos casos un turismo debe llevar de día la luz de cruce encendida?",
  ["Al circular por un carril reversible.", "Al circular por autovía con sol.", "Al circular por un carril bien señalizado de la ciudad."],
  "Durante el día deben llevar luz de cruce quienes circulen por un carril reversible, por un carril adicional circunstancial o por un carril habilitado en sentido contrario al habitual. Las motocicletas la llevan siempre.",
  ["No hay obligación general en autovía para un turismo.", "Solo es obligatoria en los carriles especiales citados."],
  "Carril reversible o contrario: cruce, aunque sea de día.");
Q("luces", "img:s5", "Al mediodía entra en el tramo señalizado con esta señal. ¿Qué debe hacer con el alumbrado?",
  ["Encenderlo, aunque sea de día.", "No hace falta, porque es de día.", "Encenderlo solo si el tramo supera 1 km."],
  "En túneles, pasos inferiores y tramos con la señal de túnel (S-5) el alumbrado es obligatorio a cualquier hora.",
  ["La hora no importa en túneles y pasos inferiores.", "No existe un mínimo de longitud."],
  "Túnel: luz siempre.");
Q("luces", null, "Queda inmovilizado de noche en el arcén. ¿Qué luces debe llevar encendidas?",
  ["Las de posición y, si procede, las de gálibo.", "Las de carretera, para que le vean mejor.", "Ninguna, para no gastar batería."],
  "Un vehículo inmovilizado en calzada o arcén entre el ocaso y la salida del sol debe mantener encendidas las luces de posición y, si las tiene, las de gálibo.",
  ["La de carretera está prohibida con el vehículo parado.", "Inmovilizarse sin luces es una infracción grave."],
  "Inmovilizado de noche: posición.");
Q("luces", null, "Estaciona de noche en una travesía insuficientemente iluminada. ¿Qué debe hacer con las luces?",
  ["Dejar encendidas las de posición, o las de estacionamiento en algunos casos.", "Apagarlas todas.", "Dejar puesta la de cruce."],
  "En una travesía mal iluminada, el vehículo parado o estacionado debe llevar la luz de posición, que en ciertos casos puede sustituirse por la de estacionamiento.",
  ["Sin luces sería una infracción.", "La de cruce no es la exigida para un vehículo estacionado."],
  "Travesía oscura: posición puesta.");
Q("luces", null, "¿En qué caso puede usar la luz antiniebla delantera sin que haya niebla?",
  ["En vías estrechas con muchas curvas, de calzada de 6,50 m o menos y señalizadas como sucesión de curvas.", "Siempre que sea de noche.", "En cualquier carretera sin iluminación."],
  "Además de con niebla, lluvia intensa, nieve, humo o polvo, la antiniebla delantera se admite en vías estrechas con muchas curvas: calzada de 6,50 m o menos y señalizada como sucesión de curvas próximas.",
  ["La noche, por sí sola, no justifica usarla.", "La falta de iluminación se resuelve con la luz de carretera."],
  "Antiniebla delantera: 6,50 m y muchas curvas.");
Q("luces", null, "Cae una lluvia ligera y hay visibilidad aceptable. ¿Puede encender la antiniebla trasera?",
  ["No, solo en condiciones especialmente desfavorables.", "Sí, cuando llueve siempre se puede.", "Sí, si circula por autopista."],
  "La antiniebla trasera se reserva para condiciones especialmente desfavorables, como niebla espesa o lluvia muy intensa. Con lluvia ligera deslumbra al de detrás y se confunde con el freno.",
  ["La lluvia debe ser muy intensa.", "El tipo de vía no cambia la regla."],
  "Antiniebla trasera: solo si casi no se ve.");
Q("luces", null, "Se le avería el alumbrado y no lo puede reparar en ruta, por lo que ve menos. ¿Qué debe hacer?",
  ["Reducir la velocidad hasta poder detenerse dentro de la zona iluminada.", "Mantener la velocidad para llegar antes.", "Seguir con los intermitentes de emergencia a la velocidad normal."],
  "Si una avería irreparable obliga a circular con menos luz, la velocidad debe permitir detener el vehículo dentro de la zona que alumbran los faros.",
  ["Llegar antes no compensa no poder frenar a tiempo.", "La emergencia no le permite ver más."],
  "Tan lento como para parar dentro de mi luz.");
Q("luces", null, "Quiere avisar de que va a adelantar. ¿Dónde puede usar ráfagas de luz?",
  ["Tanto dentro como fuera de poblado.", "Solo fuera de poblado.", "Solo dentro de poblado."],
  "Las ráfagas sirven como aviso de adelantamiento en cualquier vía. La regla distinta es la del claxon: para avisar de un adelantamiento, solo fuera de poblado.",
  ["Esa limitación es la del claxon, no la de las ráfagas.", "No está limitado a poblado."],
  "Ráfagas: en todas partes. Claxon: solo fuera.");
Q("luces", null, "No le funcionan los intermitentes y debe avisar de un giro a la izquierda. ¿Cómo lo indica con el brazo?",
  ["Con el brazo izquierdo extendido horizontalmente.", "Moviendo el brazo arriba y abajo.", "Con el brazo izquierdo doblado hacia arriba."],
  "Brazo izquierdo extendido en horizontal: giro a la izquierda. Brazo izquierdo doblado hacia arriba: giro a la derecha. Moverlo arriba y abajo: voy a reducir la velocidad.",
  ["Eso avisa de que va a reducir la velocidad.", "Eso avisa de un giro a la derecha."],
  "Horizontal, izquierda. Arriba, derecha. Oscilando, frenar.");
Q("luces", null, "¿Cuándo debe llevar luces de gálibo un vehículo?",
  ["Cuando tiene más de 2,10 m de anchura.", "Cuando mide más de 4 m de largo.", "Todos los turismos, de noche."],
  "Las luces de gálibo marcan el contorno de los vehículos anchos. Son obligatorias cuando superan los 2,10 m de anchura.",
  ["El criterio es la anchura, no la longitud.", "Un turismo normal no las lleva."],
  "Gálibo: más de 2,10 m de ancho.");
Q("luces", null, "De noche, un ciclista circula por una vía interurbana. ¿Qué debe llevar además de las luces?",
  ["Una prenda reflectante visible a 150 m.", "Un chaleco solo si circula por autovía.", "Nada más: basta con las luces."],
  "Cuando es obligatorio el alumbrado, en vía interurbana el ciclista debe llevar una prenda reflectante que permita a los conductores distinguirlo a 150 metros.",
  ["La obligación es para cualquier vía interurbana.", "La prenda reflectante también es obligatoria."],
  "Ciclista de noche en carretera: reflectante a 150 m.");
Q("luces", null, "¿Cuándo debe ir iluminada la placa de matrícula trasera?",
  ["Siempre que sea obligatorio llevar alumbrado.", "Solo en poblado.", "Solo en autopista."],
  "La placa trasera debe estar iluminada cuando se exija llevar alumbrado, para poder leerla.",
  ["No depende de que sea poblado.", "No depende del tipo de vía."],
  "Con luces puestas, matrícula iluminada.");

/* ---- ESTACIONAR EN PENDIENTE ---- */
Q("parada", null, "Estaciona un coche manual en una pendiente ascendente (cuesta arriba). Además del freno de estacionamiento, ¿qué marcha debe dejar?",
  ["La primera velocidad.", "La marcha atrás.", "Punto muerto."],
  "En un coche manual: primera en pendiente ascendente y marcha atrás en descendente. Así el motor retiene el coche en el sentido en que tendería a caer.",
  ["La marcha atrás corresponde a la pendiente descendente.", "En punto muerto, nada retiene el coche si falla el freno."],
  "Cuesta arriba, primera. Cuesta abajo, atrás.");
Q("parada", null, "Estaciona un coche manual en una pendiente descendente (cuesta abajo). ¿Qué marcha debe dejar?",
  ["La marcha atrás.", "La primera velocidad.", "La marcha más larga."],
  "En pendiente descendente se deja la marcha atrás. Si el coche tiende a caer hacia delante, esa marcha es la que se opone al giro de las ruedas.",
  ["La primera corresponde a la pendiente ascendente.", "Una marcha larga retiene peor y no es la indicada."],
  "Mirando hacia abajo: marcha atrás.");
Q("parada", null, "Deja un coche automático estacionado en pendiente. ¿Qué debe hacer con el selector?",
  ["Ponerlo en la posición de estacionamiento (P) y accionar el freno.", "Dejarlo en D.", "Dejarlo en N."],
  "Los vehículos sin cambio manual usan la posición de estacionamiento, además del freno de estacionamiento.",
  ["En D el coche sigue en posición de marcha.", "N es punto muerto y no bloquea la transmisión."],
  "Automático: P y freno.");
Q("parada", null, "Estaciona cuesta arriba junto a un bordillo. ¿Hacia dónde debe orientar las ruedas delanteras?",
  ["Hacia el centro de la calzada.", "Hacia el bordillo.", "Completamente rectas."],
  "Cuesta arriba, con el volante hacia la calzada, si el coche retrocede una rueda delantera se apoya en el bordillo y lo detiene.",
  ["Esa orientación corresponde a la bajada.", "Rectas, el coche podría rodar sin ningún tope."],
  "Subo: ruedas hacia la calzada. Bajo: hacia el bordillo.");
Q("parada", null, "Estaciona cuesta abajo junto a un bordillo. ¿Hacia dónde debe orientar las ruedas delanteras?",
  ["Hacia el bordillo.", "Hacia el centro de la calzada.", "Da igual si deja una marcha puesta."],
  "Cuesta abajo se giran las ruedas hacia el bordillo: si el coche avanza, la rueda delantera topa con él.",
  ["Cuesta abajo, esa orientación llevaría el coche hacia el tráfico.", "La marcha no sustituye esta precaución."],
  "Bajo: ruedas al bordillo.");
Q("parada", null, "¿Qué vehículos deben usar calzos cuando paran o estacionan en una pendiente sensible?",
  ["Los de más de 3.500 kg de MMA, los autobuses y los conjuntos de vehículos.", "Todos los turismos.", "Solo los camiones de más de 12 m."],
  "La obligación de calzar afecta a los vehículos de más de 3.500 kg, los autobuses y los conjuntos, en pendiente sensible.",
  ["Un turismo solo no está obligado a calzarse.", "No depende de la longitud del camión."],
  "Calzos: más de 3.500 kg, autobuses y conjuntos.");
Q("parada", null, "No tiene calzos a mano y debe inmovilizar un conjunto en pendiente. ¿Puede usar piedras?",
  ["No, solo elementos destinados expresamente a esa función.", "Sí, si son grandes.", "Sí, si las retira después."],
  "El Reglamento prohíbe usar piedras u otros objetos no destinados expresamente a esa función.",
  ["El tamaño no cambia la prohibición.", "Retirarlas es obligatorio con los calzos, pero las piedras no están permitidas."],
  "Calzos sí, piedras nunca.");
Q("parada", null, "Ha usado calzos para inmovilizar el vehículo. ¿Qué debe hacer al reanudar la marcha?",
  ["Retirarlos de la vía.", "Dejarlos en el arcén.", "Dejarlos donde estaban, por si otro los necesita."],
  "Los calzos deben retirarse de la vía al reanudar la marcha para que no sean un obstáculo.",
  ["El arcén sigue siendo parte de la vía.", "Abandonarlos en la vía crea un peligro."],
  "Sigo la marcha: calzos fuera.");
Q("parada", null, "Estaciona un turismo con remolque ligero en una pendiente sensible. ¿Qué debe hacer?",
  ["Colocar calzos o apoyar una rueda directriz en el bordillo.", "Accionar únicamente el freno de mano.", "Calzar con cualquier objeto que tenga a mano."],
  "El conjunto debe quedar inmovilizado con calzos adecuados o, en su caso, apoyando una de las ruedas directrices en el bordillo. El freno de mano solo no basta.",
  ["Con un conjunto en pendiente sensible no basta.", "No sirven objetos no destinados a esa función."],
  "Con remolque: calzo o rueda al bordillo.");
Q("parada", null, "Baja un puerto largo con un coche manual. ¿Qué marcha debe llevar y qué debe evitar?",
  ["Una marcha corta, similar a la que usaría para subir, sin bajar en punto muerto.", "Punto muerto, para ahorrar combustible.", "La marcha más larga, frenando continuamente."],
  "Con una marcha corta se aprovecha la retención del motor y se evita recalentar los frenos. En punto muerto se pierde esa retención y se carga todo en los frenos.",
  ["No ahorra lo que se pierde en seguridad.", "Frenar continuamente recalienta los frenos."],
  "Bajo con la marcha con la que subiría.");
Q("parada", null, "En una vía interurbana, ¿dónde debe parar o estacionar?",
  ["Fuera de la calzada, a la derecha, dejando libre la parte transitable del arcén.", "En la calzada, pegado al borde derecho.", "A la izquierda, si hay más sitio."],
  "En interurbana, la parada y el estacionamiento se hacen fuera de la calzada, en el lado derecho, sin ocupar la parte transitable del arcén.",
  ["Eso es propio de las vías urbanas.", "Fuera de poblado la regla es el lado derecho."],
  "Fuera de poblado: fuera de la calzada, a la derecha.");
Q("parada", null, "En una calle urbana de sentido único, ¿puede estacionar en el lado izquierdo?",
  ["Sí, salvo señal en contra.", "No, siempre a la derecha.", "Solo si para menos de dos minutos."],
  "En vías urbanas se estaciona lo más cerca posible del borde derecho, salvo en las de sentido único, donde también se puede hacer en el izquierdo.",
  ["Las de sentido único son la excepción.", "No hay un límite de dos minutos en esta regla."],
  "Sentido único: también por la izquierda.");
Q("parada", null, "Salvo señal o circunstancia que lo justifique, ¿cómo se debe colocar el vehículo al estacionar?",
  ["Paralelamente al borde de la calzada.", "En batería siempre.", "En diagonal para ocupar menos."],
  "La norma general es estacionar en paralelo al borde, aprovechando bien el espacio disponible.",
  ["La batería solo se usa si la vía o la señalización lo indica.", "La diagonal tampoco es la regla general."],
  "Por defecto: en paralelo.");
Q("parada", "img:r308a", "¿Qué indica esta señal de estacionamiento con una barra vertical blanca?",
  ["Estacionamiento prohibido los días impares.", "Estacionamiento prohibido los días pares.", "Estacionamiento permitido a una sola fila."],
  "Con un trazo blanco se prohíbe estacionar los días impares. Con dos trazos, los pares. El truco es que un trazo equivale al 1, número impar.",
  ["Los días pares se señalan con dos trazos.", "No tiene relación con el número de filas."],
  "Una raya: días impares. Dos rayas: pares.");

Q("motos", null, "Acaba de sacarse el permiso B. ¿Puede conducir una moto de 125 cc en España?",
  ["No, el permiso B necesita más de 3 años de antigüedad para eso.", "Sí, desde el primer día.", "Sí, pero solo con pasajero mayor de edad."],
  "El permiso B en vigor con más de 3 años de antigüedad autoriza a conducir en España las motocicletas que permite el A1.",
  ["Falta la antigüedad de más de 3 años.", "El pasajero no tiene relación con este requisito."],
  "B + más de 3 años = moto de 125 en España.");

  ["No es una regla europea.", "La potencia no amplía el territorio."],
  "125 con B: solo en España.");
Q("motos", null, "Con más de 3 años de permiso B, ¿qué motocicleta puede conducir?",
  ["Una de hasta 125 cc, 11 kW y 0,1 kW/kg.", "Una de hasta 250 cc.", "Una de hasta 35 kW."],

  ["250 cc excede la cilindrada autorizada.", "35 kW es el límite del A2."],
  "A1: 125 cc, 11 kW, 0,1 kW/kg.");
Q("motos", null, "Con el permiso B, ¿puede conducir una motocicleta de más de 125 cc?",
  ["No, aunque tenga muchos años de permiso.", "Sí, con más de 5 años de antigüedad.", "Sí, si es automática."],

  ["La antigüedad no aumenta la cilindrada.", "El tipo de cambio no influye."],
  "Más de 125 cc: otro permiso.");
Q("motos", null, "¿Autoriza el permiso B a conducir una motocicleta con sidecar?",
  ["No.", "Sí, si tiene más de 3 años de antigüedad.", "Sí, en cualquier caso."],

Q("motos", null, "Con el permiso B, ¿puede conducir un ciclomotor?",

  "Ciclomotor: sí, desde el primer día de B.");
Q("motos", null, "¿Cuál es la edad mínima para el permiso AM de ciclomotores?",

  "AM: 15 años. A1: 16 años. A2 y B: 18 años. A: 20 años, con 2 años de A2.",

  "Ciclomotor: nunca autopista ni autovía.");
Q("motos", null, "¿Puede circular por autopista una motocicleta de 125 cc, y a qué velocidad máxima genérica?",

  "Moto 125 sí a autopista; ciclomotor no.");
Q("motos", null, "¿Qué luz debe llevar una motocicleta durante el día?",
  ["La de cruce, en cualquier vía.", "Ninguna, si hay buena visibilidad.", "La de cruce, solo en vías interurbanas."],
  "Las motocicletas deben llevar la luz de cruce encendida de día, en vía urbana e interurbana, con cualquier tiempo.",

  "Moto: cruce puesta siempre, también de día.");
Q("motos", null, "¿Quién puede viajar como pasajero en una motocicleta, con carácter general?",
  ["Un mayor de 12 años con casco.", "Cualquier persona, si lleva casco.", "Solo un mayor de 18 años."],
  "La norma general exige más de 12 años y casco, y que la moto tenga esa plaza autorizada.",

  "Pasajero de moto: más de 12 años y casco.");
Q("motos", null, "Excepcionalmente, ¿puede un niño de 9 años ir de pasajero en moto?",

Q("motos", null, "¿Cómo debe ir sentado el pasajero de una motocicleta?",
  ["Detrás del conductor, a horcajadas, con los pies en los reposapiés.", "Entre el conductor y el manillar, si es un niño.", "De lado, si lleva falda."],

Q("motos", null, "¿Con qué condiciones puede una motocicleta arrastrar un remolque?",

  "Moto con remolque: 50 %, de día y −10 %.");

  "Moto: 4 años y después cada 2.");

  ["Con 3 años y luego cada 2 años.", "Con 4 años y luego cada 2 años.", "No debe pasarla."],
  "Los ciclomotores están exentos hasta los 3 años y después pasan la ITV cada 2 años. Las motos, en cambio, a los 4.",

/* ================= FIGURAS (SVG) ================= */
/* Señales oficiales: img/senales/<código>.svg (Wikimedia Commons, ver README). */
const SIGN_FILE = { stop: 'r2', ceda: 'r1' };
function svgWrap(inner, vb, label) { return `<svg viewBox="${vb}" role="img" aria-label="${label}">${inner}</svg>`; }

function light(kind) {
  const lamp = (cy, on, c, dim) => `<circle cx="50" cy="${cy}" r="12" fill="${on ? c : dim}"/>`;
  const a = kind.startsWith('amber');
  let s = '<rect x="28" y="6" width="44" height="88" rx="9" fill="#1d232b"/>';
  s += lamp(26, kind === 'red', '#ff3b30', '#4a2321');
  s += lamp(50, a, '#ffb300', '#4d3b10');
  s += lamp(74, kind === 'green', '#31d158', '#17391f');
  if (kind === 'amberflash') s += '<g stroke="#ffb300" stroke-width="3" stroke-linecap="round"><path d="M20 50h-8M80 50h8M25 36l-6-6M75 36l6-6M25 64l-6 6M75 64l6 6"/></g>';
  return svgWrap(s, '0 0 100 100', 'Semáforo');
}

function road(kind) {
  const mixed = kind.startsWith('mixed');
  let s = '<rect width="240" height="200" fill="#c9d6b5"/><rect x="62" y="0" width="116" height="200" fill="#4b5563"/>';
  s += '<rect x="66" y="0" width="2" height="200" fill="#f3f4f6"/><rect x="172" y="0" width="2" height="200" fill="#f3f4f6"/>';
  if (kind === 'cont') s += '<rect x="118.5" y="0" width="3" height="200" fill="#fff"/>';
  else {
    const solidRight = kind === 'mixedNO';
    const dash = (x) => `<line x1="${x}" y1="0" x2="${x}" y2="200" stroke="#fff" stroke-width="3" stroke-dasharray="14 10"/>`;
    const solid = (x) => `<rect x="${x - 1.5}" y="0" width="3" height="200" fill="#fff"/>`;
    s += solidRight ? solid(124) + dash(116) : solid(116) + dash(124);
  }
  const car = (x, y, c, l) => `<g transform="translate(${x} ${y})"><rect x="-13" y="-24" width="26" height="48" rx="6" fill="${c}"/><rect x="-9" y="-16" width="18" height="12" rx="3" fill="#cfe8ff"/><text y="16" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="13" fill="#fff">${l}</text></g>`;
  s += car(147, 60, '#d33a2f', 'B') + car(147, 150, '#1f5fd6', 'A');
  return svgWrap(s, '0 0 240 200', 'Carretera con marca vial central');
}

function cruce(spec) {
  const COL = { A: '#1f5fd6', B: '#d33a2f', C: '#d99a00', D: '#1a9b5b' };
  const POS = { S: [130, 196, 0, [158, 168]], N: [110, 44, 180, [64, 62]], W: [44, 130, 90, [58, 160]], E: [196, 110, 270, [176, 62]] };
  let s = '<rect width="240" height="240" fill="#c9d6b5"/><rect x="90" y="0" width="60" height="240" fill="#4b5563"/><rect x="0" y="90" width="240" height="60" fill="#4b5563"/><rect x="90" y="90" width="60" height="60" fill="#4b5563"/>';
  s += '<g stroke="#e5e7eb" stroke-width="2" stroke-dasharray="10 8"><line x1="120" y1="0" x2="120" y2="86"/><line x1="120" y1="154" x2="120" y2="240"/><line x1="0" y1="120" x2="86" y2="120"/><line x1="154" y1="120" x2="240" y2="120"/></g>';
  const arrow = (t, c) => {
    const p = t === 'L' ? 'M0,-22 L0,-34 Q0,-46 -14,-46 L-30,-46' : t === 'R' ? 'M0,-22 L0,-34 Q0,-46 14,-46 L30,-46' : 'M0,-22 L0,-48';
    return `<path d="${p}" fill="none" stroke="#fff" stroke-width="3.5"/><path d="${p}" fill="none" stroke="${c}" stroke-width="1.5"/>`;
  };
  spec.split(',').forEach(it => {
    const m = it.match(/^([A-D])=([SNWE])(?:>([LRS]))?(?::(\w+))?$/);
    if (!m) return;
    const [, id, dir, turn, sign] = m;
    const [x, y, rot, sp] = POS[dir];
    s += `<g transform="translate(${x} ${y}) rotate(${rot})"><rect x="-10" y="-17" width="20" height="34" rx="5" fill="${COL[id]}" stroke="#fff" stroke-width="1.5"/><rect x="-7" y="-12" width="14" height="9" rx="2" fill="#cfe8ff"/><g transform="rotate(${-rot}) translate(0 7)"><text text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="12" fill="#fff">${id}</text></g>${turn ? arrow(turn, COL[id]) : ''}</g>`;
    if (sign && SIGN_FILE[sign]) s += `<image href="img/senales/${SIGN_FILE[sign]}.svg" x="${sp[0] - 15}" y="${sp[1] - 15}" width="30" height="30"/>`;
  });
  return svgWrap(s, '0 0 240 240', 'Intersección');
}

function isleta() {
  let s = '<rect width="240" height="240" fill="#c9d6b5"/>';
  s += '<rect x="0" y="34" width="240" height="66" fill="#59626f"/><rect x="72" y="100" width="116" height="140" fill="#59626f"/>';
  s += '<line x1="0" y1="67" x2="240" y2="67" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="10 8"/>';
  s += '<path d="M130 176 L108 102 Q130 94 152 102 Z" fill="#e7e2d6" stroke="#fff" stroke-width="2"/>';
  s += '<rect x="146" y="101" width="42" height="5" fill="#fff"/>';
  s += '<image href="img/senales/r401a.svg" x="110" y="142" width="40" height="40"/>';
  s += '<image href="img/senales/r2.svg" x="192" y="104" width="40" height="40"/>';
  s += '<g transform="translate(164 200)"><rect x="-10" y="-17" width="20" height="34" rx="5" fill="#1f5fd6" stroke="#fff" stroke-width="1.5"/><rect x="-7" y="-12" width="14" height="9" rx="2" fill="#cfe8ff"/></g>';
  return svgWrap(s, '0 0 240 240', 'Coche que llega a una intersección con una isleta con la señal de paso obligatorio por la derecha y una señal de STOP');
}

const isSign = (f) => f.startsWith('img:');
function figure(f) {
  if (!f) return '';
  const [k, v] = f.split(':');
  if (k === 'light') return light(v);
  if (k === 'road') return road(v);
  if (k === 'cruce') return cruce(f.slice(6));
  if (k === 'isleta') return isleta();
  if (k === 'img') return `<img src="img/senales/${v}.svg" alt="Señal de tráfico ${v.toUpperCase()}">`;
  return '';
}

function diagram(d) {
  const T = (x, y, t, o = '') => `<text x="${x}" y="${y}" font-family="Arial,Helvetica,sans-serif" font-size="11" ${o.includes('fill=') ? '' : 'fill="#1c2733"'} ${o}>${t}</text>`;
  const car = (x, y, c) => `<g transform="translate(${x} ${y})"><rect width="54" height="22" rx="6" fill="${c}"/><rect x="30" y="3" width="18" height="9" rx="2" fill="#cfe8ff"/><circle cx="13" cy="23" r="5" fill="#222"/><circle cx="41" cy="23" r="5" fill="#222"/></g>`;
  if (d === 'pendiente') {
    const auto = (x, up) => { const r = up ? -28 : 28, fw = (y) => `<rect x="-8" y="-3.5" width="16" height="7" rx="2" fill="#111" transform="translate(${x + 116} ${y}) rotate(${r})"/>`;
      return `<rect x="${x}" y="28" width="160" height="66" fill="#4b5563"/><rect x="${x}" y="94" width="160" height="20" fill="#9ca3af"/>` +
        `<rect x="${x + 44}" y="44" width="84" height="36" rx="8" fill="#1f5fd6"/><rect x="${x + 106}" y="48" width="14" height="28" rx="3" fill="#cfe8ff"/>` +
        fw(43) + fw(81) + `<rect x="${x + 50}" y="40" width="16" height="6" rx="2" fill="#111"/><rect x="${x + 50}" y="78" width="16" height="6" rx="2" fill="#111"/>` + T(x + 8, 108, 'bordillo', 'font-size="10"'); };
    return svgWrap(T(10, 18, 'Cuesta ARRIBA', 'font-weight="700"') + T(186, 18, 'Cuesta ABAJO', 'font-weight="700"') +
      auto(10, true) + auto(186, false) +
      T(10, 134, 'Primera marcha', 'font-weight="700"') + T(186, 134, 'Marcha atrás', 'font-weight="700"') +
      T(10, 150, 'Ruedas hacia la calzada') + T(186, 150, 'Ruedas hacia el bordillo') +
      T(10, 166, 'Freno de estacionamiento') + T(186, 166, 'Freno de estacionamiento'), '0 0 356 176', 'Marcha y orientación de las ruedas al estacionar en pendiente');
  }
  if (d === 'detencion') {
    const k = 2.6, x0 = 64, bar = (y, r, f, lab, tot) => {
      const a = r * k, b = f * k;
      return T(4, y + 17, lab, 'font-weight="700"') +
        `<rect x="${x0}" y="${y}" width="${a}" height="26" fill="#f0b429"/><rect x="${x0 + a}" y="${y}" width="${b}" height="26" fill="#d64545"/>` +
        T(x0 + a / 2, y + 17, r + ' m', 'text-anchor="middle"') + T(x0 + a + b / 2, y + 17, f + ' m', 'text-anchor="middle" fill="#fff"') +

function pickStudy(topic, n) {
  const rank = { fail: 0, new: 1, learning: 2, mastered: 3 };
  let pool = BANK.filter(q => topic === 'all' || q.t === topic).map(q => q.id);
  pool = pool.map(id => [id, rank[status(id)] + Math.random() * 1.8]).sort((a, b) => a[0] === b[0] ? 0 : a[1] - b[1]).map(p => p[0]);
  return shuf(pool.slice(0, n === 0 ? pool.length : n));
}

function start(mode, ids) {
  clearInterval(timerId);
  if (!ids.length) return;
  const vsec = ids.reduce((a, id) => a + (BANK[id].v ? SCENES[BANK[id].v].dur * 3 : 0), 0);
  ses = { mode, ids, perm: {}, ans: {}, done: {}, vv: {}, cur: 0, t0: Date.now(), limit: EXAM_SECS + vsec, left: EXAM_SECS + vsec, filter: 'all' };
  ids.forEach(id => { ses.perm[id] = shuf([0, 1, 2]); if (BANK[id].v) ses.vv[id] = { left: 3, went: false, playing: false, viewed: false }; });
  view = 'q';

  render(); window.scrollTo(0, 0);
}
function tick() {
  if (!ses || ses.mode !== 'exam' || view !== 'q') return;
  ses.left--;
  const c = document.getElementById('clock');
  if (c) { c.textContent = fmt(ses.left); c.classList.toggle('low', ses.left <= 300); }
  if (ses.left <= 0) finish();
}
function commit(id) {
  if (ses.done[id]) return;
  const ch = ses.ans[id];
  ses.done[id] = true;
  record(id, ch === 0);
}
function finish() {
  clearInterval(timerId);
  ses.ids.forEach(id => { if (!ses.done[id]) commit(id); });
  ses.secs = Math.round((Date.now() - ses.t0) / 1000);
  if (ses.mode === 'exam') {
    const err = ses.ids.filter(id => ses.ans[id] !== 0).length;
    DB.exams.push({ d: Date.now(), err, secs: Math.min(ses.secs, ses.limit) });
    DB.exams = DB.exams.slice(-12);

      <li>Adelantar a ciclistas: 1,5 m laterales, reducir al menos 20 km/h respecto al límite fuera de poblado y cambiar completamente de carril si hay más de uno por sentido. Detrás de un ciclista, 5 m de separación.</li>
      <li>Ciclistas: casco en vías interurbanas, y en cualquier vía para menores de 16 años y profesionales (en ciudad).</li>
      <li>Patinetes (VMP): 15 años, casco, luz o reflectante visible a 150 m. Alumbrado diurno obligatorio desde el 1 de octubre de 2027.</li>
      <li>Motos: guantes en vías interurbanas y calzado cerrado en todas; casco homologado en ciclomotores desde el 1 de octubre de 2027; arcén a 30 km/h solo en retenciones y tramos señalizados.</li>
      <li>Atascos en autopista y autovía: carril de emergencia para vehículos prioritarios. Con nieve, prohibido adelantar.</li>
      <li>Cinturón sin exenciones para taxistas, mercancías y autoescuela. Peatón con prioridad en plataforma única.</li></ul></div>
    <div><h3>Motos de 125 con el permiso B</h3><ul>
      <li>Hace falta el permiso B en vigor con más de 3 años de antigüedad. Solo vale en España y solo para motos que autoriza el A1: 125 cc, 11 kW y 0,1 kW/kg.</li>
      <li>La DGT ha anunciado un curso obligatorio, pero no se ha podido confirmar que esté en vigor. Compruébalo en la DGT antes de conducir una.</li></ul></div>
    <div><h3>Patinetes: registro y seguro</h3><ul>
      <li>Registro en el Registro de Vehículos Personales Ligeros de la DGT (RD 52/2026) y seguro obligatorio (Ley 5/2025). Los modelos no certificados pueden circular hasta el 22 de enero de 2027 si están registrados y asegurados.</li></ul></div>
    <p class="note">Fuentes: ${L('https://www.boe.es/diario_boe/txt.php?id=BOE-A-2026-13889','BOE, RD 518/2026')}, ${L('https://www.dgt.es/comunicacion/notas-de-prensa/20260930-reforma-del-reglamento-de-circulacion-usuarios-vulnerables/','DGT, reforma del Reglamento')}, ${L('https://www.dgt.es/comunicacion/noticias/20251020-examen-teorico-la-importancia-de-conocer-el-riesgo/','DGT, examen teórico')}, ${L('https://www.dgt.es/nuestros-servicios/permisos-de-conducir/obtener-un-nuevo-permiso-de-conducir/requisitos-preparacion-y-presentacion-a-examen/','DGT, requisitos')}, ${L('https://www.boe.es/diario_boe/txt.php?id=BOE-A-2026-2140','BOE, RD 52/2026')}. Los puntos de cada infracción vienen del cuadro de la Ley de Tráfico, no del reglamento.</p>
  </div></details>`;
}

function homeHtml() {
  const ids = BANK.map(q => q.id);
  const st = ids.map(status);
  const cnt = (k) => st.filter(x => x === k).length;
  let tot = 0, ok = 0;
  Object.values(DB.stats).forEach(s => { tot += s.c + s.w; ok += s.c; });
  const passed = DB.exams.filter(e => e.err <= EXAM_MAX_ERR).length;
  const fails = cnt('fail');
  let h = `<section class="hero"><h1>Examen teórico, permiso B</h1>
    <p>Simulacro con el formato del examen de la DGT y explicación de cada respuesta, tanto si acierta como si falla.</p>
    <div class="rule"><span><b>${EXAM_N}</b> preguntas</span><span><b>30</b> minutos${DB.prefs.video ? ' + duración del vídeo' : ''}</span><span>3 opciones, 1 correcta</span><span>Máximo <b>${EXAM_MAX_ERR}</b> fallos</span></div></section>`;
  h += `<div class="stats num">
    <div class="stat"><b>${tot ? Math.round(ok / tot * 100) + '%' : '–'}</b><span>aciertos totales</span></div>
    <div class="stat"><b>${cnt('mastered')}/${BANK.length}</b><span>preguntas dominadas</span></div>
    <div class="stat"><b>${DB.exams.length ? passed + '/' + DB.exams.length : '–'}</b><span>exámenes aprobados</span></div></div>`;
  h += `<div class="modes">
    <button class="btn big" data-act="exam"><span>Examen simulado<small>30 preguntas · 30 min${DB.prefs.video ? ' + vídeo' : ''} · sin volver atrás, como el real</small></span><span>→</span></button>
    <button class="btn big alt" data-act="cfg"><span>Modo estudio<small>Verás la explicación al contestar cada pregunta</small></span><span>→</span></button>
    <button class="btn big alt" data-act="miexamen"><span>Lo que me salió en el examen<small>${BANK.length - EXAMEN_DESDE} preguntas sobre lo que recuerdas de tu examen real</small></span><span>→</span></button>
    <button class="btn big alt" data-act="refuerzo"><span>Refuerzo: lo que faltaba<small>${BANK.length - REFUERZO_DESDE} preguntas nuevas de luces, motos 125, pendientes, señales, agentes y marcas viales</small></span><span>→</span></button>
    <button class="btn big alt" data-act="repaso" ${fails ? '' : 'disabled'}><span>Repasar mis fallos<small>${fails ? fails + ' preguntas pendientes de aprender' : 'Aún no tienes fallos pendientes'}</small></span><span>→</span></button></div>
    <label class="optline" for="optvideo"><input type="checkbox" id="optvideo" ${DB.prefs.video ? 'checked' : ''}><span>Incluir en el examen una pregunta con vídeo de percepción del riesgo, como anunció la DGT. Se ve hasta 3 veces antes de ver la pregunta y el tiempo se amplía según la duración del vídeo.</span></label>
    ${infoHtml()}`;
  h += '<h2 class="sec">Temas</h2><div class="topics">';
  Object.keys(TOPICS).forEach(t => {
    const qs = BANK.filter(q => q.t === t), n = qs.length;
    const m = qs.filter(q => status(q.id) === 'mastered').length, f = qs.filter(q => status(q.id) === 'fail').length;
    h += `<button class="topic" data-act="topic" data-t="${t}"><span class="n">${TOPICS[t]}</span><span class="c num">${m}/${n}</span>
      <span class="meter"><i class="m" style="width:${m / n * 100}%"></i><i class="f" style="width:${f / n * 100}%"></i></span></button>`;
  });
  h += '</div>';
  if (DB.exams.length) {
    h += '<h2 class="sec">Últimos exámenes (fallos por examen)</h2><div class="hist num">';
    DB.exams.slice(-12).forEach(e => { h += `<div class="${e.err <= EXAM_MAX_ERR ? 'p' : 'x'}" style="height:${Math.max(8, Math.min(e.err, 12) / 12 * 100)}%" title="${e.err} fallos"><span>${e.err}</span></div>`; });
    h += '</div><p class="note">Verde: apto (3 fallos o menos). Rojo: no apto.</p>';
  }
  h += `<p class="note" style="margin-top:24px">Las preguntas son originales y siguen el temario y el estilo del examen oficial; el banco oficial de la DGT no es público. La normativa está actualizada a noviembre de 2026 (Real Decreto 518/2026, en vigor desde el 1 de octubre). Antes de examinarte, repasa el manual de tu autoescuela por si hubiera cambios.</p>`;
  h += resetAsk
    ? '<p class="note">¿Borrar todo tu progreso? <button class="linkbtn" data-act="reset-yes">Sí, borrar</button> <button class="linkbtn" data-act="reset-no">Cancelar</button></p>'
    : '<p class="note"><button class="linkbtn" data-act="reset">Borrar mi progreso</button></p>';
  return h;
}

function cfgHtml() {
  const opts = Object.keys(TOPICS).map(t => `<option value="${t}" ${cfg.topic === t ? 'selected' : ''}>${TOPICS[t]}</option>`).join('');
  const chip = (n, l) => `<button class="chip${cfg.n === n ? ' on' : ''}" data-act="n" data-n="${n}">${l}</button>`;
  return `<h1 style="font-size:30px;margin-bottom:14px">Modo estudio</h1><div class="cfg">
    <label for="topic">Tema<select id="topic"><option value="all" ${cfg.topic === 'all' ? 'selected' : ''}>Todos los temas</option>${opts}</select></label>
    <div><div style="font-weight:600;font-size:14px;margin-bottom:6px">Número de preguntas</div><div class="chips">${chip(10, '10')}${chip(20, '20')}${chip(40, '40')}${chip(0, 'Todas')}</div></div>
    <p class="hint" style="margin:0">Se priorizan las que has fallado y las que aún no has visto.</p>
    <button class="btn" data-act="go-study">Empezar</button></div>`;
}

function qHtml() {
  const s = ses, id = s.ids[s.cur], q = BANK[id], perm = s.perm[id];
  const ch = s.ans[id], study = s.mode !== 'exam', rev = study && ch !== undefined;
  let ticks = '';
  s.ids.forEach((qid, i) => {
    let c = 'tick';
    if (i === s.cur) c += ' now'; else if (s.done[qid]) c += s.mode === 'exam' ? ' done' : (s.ans[qid] === 0 ? ' ok' : ' no');
    ticks += `<span class="${c}"></span>`;
  });
  const okSoFar = s.ids.filter(i => s.done[i] && s.ans[i] === 0).length;
  const head = `<div class="ticks" aria-hidden="true">${ticks}</div>
    <div class="qhead"><b>Pregunta ${s.cur + 1} de ${s.ids.length}</b><span>${study ? 'Aciertos: ' + okSoFar + ' · ' : ''}${TOPICS[q.t]}</span></div>`;
  if (q.v && !s.vv[id].went) {
    return head + `<div class="vid"><p class="qtext" style="margin:0 0 12px">Observa la escena, vista desde arriba. Tú conduces el vehículo azul (A). Fíjate en las situaciones de riesgo: después responderás una pregunta.</p>
      <canvas width="${VW}" height="${VH}" data-scene="${q.v}" role="img" aria-label="Escena de tráfico animada"></canvas>
      <div class="vbar"><button class="btn" data-act="vplay" id="vplay">Ver vídeo</button><span class="vnote" id="vleft"></span><button class="btn ghost" data-act="vgo" id="vgo" disabled>Ir a la pregunta</button></div></div>`;
  }
  let h = head + `
    <div class="qcard">${q.f ? `<figure class="fig${isSign(q.f) ? ' sign' : ''}">${figure(q.f)}</figure>` : ''}<div class="qtext">${q.q}</div></div><div class="opts">`;
  perm.forEach((o, p) => {
    let c = 'opt';
    if (rev) c += o === 0 ? ' right' : (o === ch ? ' wrong' : '');
    else if (ch === o) c += ' sel';
    h += `<button class="${c}" data-act="opt" data-p="${p}" ${rev ? 'disabled' : ''}><span class="lt">${'ABC'[p]}</span><span>${q.o[o]}</span></button>`;
  });
  h += '</div>';
  if (rev) h += explain(q, perm, ch);
  const last = s.cur === s.ids.length - 1;
  h += `<div class="actions"><span class="hint">${study ? '' : 'Una vez pasas a la siguiente, no puedes volver atrás.'}</span>
    <button class="btn" data-act="next" ${ch === undefined ? 'disabled' : ''}>${last ? (study ? 'Ver resumen' : 'Terminar examen') : 'Siguiente'}</button></div>`;
  return h;
}

function explain(q, perm, ch) {
  const kind = ch === undefined ? 'nil' : ch === 0 ? 'ok' : 'no';
  const head = ch === undefined ? 'Sin contestar' : ch === 0 ? 'Correcto' : 'Incorrecto';
  const correctPos = perm.indexOf(0);
  let h = `<div class="fb ${kind}"><div class="fb-h">${head}${kind !== 'ok' ? ` · la correcta es la ${'ABC'[correctPos]}` : ''}</div><div class="fb-b">
    <div><h4>Por qué</h4><p>${q.e}</p>${q.d ? `<figure class="fig wide">${diagram(q.d)}</figure>` : ''}${q.v ? `<div class="vidbox"><canvas width="${VW}" height="${VH}" data-scene="${q.v}" role="img" aria-label="Escena de tráfico"></canvas><button class="chip" data-act="playvid" data-s="${q.v}">Ver la escena otra vez</button></div>` : ''}</div><div><h4>Qué pasa con cada opción</h4><ul class="why">`;
  perm.forEach((o, p) => {
    const c = o === 0;
    h += `<li class="${c ? 'c' : 'w'}"><span class="lt">${'ABC'[p]}</span><span>${c ? '<b>Correcta.</b> ' + q.o[o] : '<b>No.</b> ' + q.x[o - 1]}${ch === o ? '<span class="tag">tu respuesta</span>' : ''}</span></li>`;
  });
  h += `</ul></div><div class="tip"><h4>Para recordarlo</h4><p>${q.k}</p></div></div></div>`;
  return h;
}

function resultHtml() {
  const s = ses, total = s.ids.length;
  const bad = s.ids.filter(id => s.ans[id] !== 0), nBad = bad.length, nOk = total - nBad;
  let h;
  if (s.mode === 'exam') {
    const apt = nBad <= EXAM_MAX_ERR;
    h = `<div class="verdict ${apt ? 'ok' : 'no'}"><h1>${apt ? 'APTO' : 'NO APTO'}</h1><p class="num"><b>${nBad}</b> ${nBad === 1 ? 'fallo' : 'fallos'} de ${total} (máximo permitido: ${EXAM_MAX_ERR}) · tiempo ${fmt(Math.min(s.secs, s.limit))} de ${fmt(s.limit)}</p></div>`;
  } else {
    h = `<div class="verdict neutral"><h1 class="num">${nOk} / ${total}</h1><p>aciertos (${Math.round(nOk / total * 100)}%). Las falladas quedan guardadas en «Repasar mis fallos».</p></div>`;
  }
  if (nBad) {
    const by = {}; bad.forEach(id => { const t = BANK[id].t; by[t] = (by[t] || 0) + 1; });
    h += '<h2 class="sec">Dónde has fallado</h2><div class="pills">' + Object.keys(by).map(t => `<span class="pill">${TOPICS[t]} · ${by[t]}</span>`).join('') + '</div>';
  }
  h += `<div class="seg"><button class="chip${s.filter === 'all' ? ' on' : ''}" data-act="filter" data-f="all">Todas</button><button class="chip${s.filter === 'bad' ? ' on' : ''}" data-act="filter" data-f="bad">Solo fallos (${nBad})</button></div>`;
  s.ids.forEach((id, i) => {
    const q = BANK[id], ch = s.ans[id], ok = ch === 0;
    if (s.filter === 'bad' && ok) return;
    h += `<details class="rev ${ok ? 'ok' : 'no'}" ${ok ? '' : 'open'}><summary><span class="st">${i + 1}</span><span>${q.q}</span></summary>${q.f ? `<figure class="fig rev-fig${isSign(q.f) ? ' sign' : ''}">${figure(q.f)}</figure>` : ''}${explain(q, s.perm[id], ch)}</details>`;
  });
  h += `<div class="actions" style="margin-top:22px"><button class="btn ghost" data-act="home">Volver al inicio</button><button class="btn" data-act="${s.mode === 'exam' ? 'exam' : 'again'}">${s.mode === 'exam' ? 'Otro examen' : 'Seguir estudiando'}</button></div>`;
  return h;
}

/* ================= EVENTOS ================= */
function choose(p) {
  if (view !== 'q') return;
  const id = ses.ids[ses.cur];
  if (ses.done[id]) return;
  if (BANK[id].v && !ses.vv[id].went) return;
  const o = ses.perm[id][p];
  if (o === undefined) return;
  ses.ans[id] = o;
  if (ses.mode !== 'exam') commit(id);
  render();
}
function next() {
  const id = ses.ids[ses.cur];
  if (ses.ans[id] === undefined) return;
  commit(id);
  if (ses.cur === ses.ids.length - 1) return finish();
  ses.cur++; render(); window.scrollTo(0, 0);
}
/* Reparto por temas para que ninguno se quede fuera. Es un criterio propio de este simulador: la DGT no publica un reparto. */
const EXAM_MIX = { senales: 6, luces: 3, maniobras: 3, velocidad: 2, prioridad: 2, parada: 2, motos: 2, docs: 2, vulnerables: 2, alcohol: 1, distancias: 1, seguridad: 1, auxilio: 1, especial: 1 };
function mixedIds(n) {
  const reg = BANK.filter(q => !q.v), picked = [];
  Object.keys(EXAM_MIX).forEach(t => { picked.push(...shuf(reg.filter(q => q.t === t).map(q => q.id)).slice(0, EXAM_MIX[t])); });
  const rest = shuf(reg.map(q => q.id).filter(id => !picked.includes(id)));
  return shuf(picked.concat(rest).slice(0, Math.max(n, picked.length))).slice(0, n);
}
function examIds() {
  const vid = BANK.filter(q => q.v).map(q => q.id);
  if (!DB.prefs.video || !vid.length) return mixedIds(EXAM_N);
  const ids = mixedIds(EXAM_N - 1);
  ids.splice(Math.floor(Math.random() * (ids.length + 1)), 0, shuf(vid)[0]);
  return ids;
}

document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a === 'exam') start('exam', examIds());
  else if (a === 'cfg') { view = 'cfg'; render(); }
  else if (a === 'n') { cfg.n = +b.dataset.n; render(); }
  else if (a === 'go-study') start('study', pickStudy(cfg.topic, cfg.n));
  else if (a === 'topic') start('study', pickStudy(b.dataset.t, 0));
  else if (a === 'miexamen') start('study', shuf(BANK.filter(q => q.id >= EXAMEN_DESDE).map(q => q.id)));
  else if (a === 'refuerzo') start('study', shuf(BANK.filter(q => q.id >= REFUERZO_DESDE).map(q => q.id)));
  else if (a === 'repaso') start('study', shuf(BANK.filter(q => status(q.id) === 'fail').map(q => q.id)));
  else if (a === 'again') start('study', pickStudy(cfg.topic, cfg.n));
  else if (a === 'opt') choose(+b.dataset.p);
  else if (a === 'next') next();
  else if (a === 'vplay') {
    const id = ses.ids[ses.cur], v = ses.vv[id]; if (!v || v.left <= 0 || v.playing) return;
    v.left--; v.playing = true; updateVBar();
    playScene(document.querySelector('canvas[data-scene]'), BANK[id].v, () => { v.playing = false; v.viewed = true; updateVBar(); });
  }
  else if (a === 'vgo') { ses.vv[ses.ids[ses.cur]].went = true; render(); }
  else if (a === 'playvid') playScene(b.parentElement.querySelector('canvas'), b.dataset.s);
  else if (a === 'quit') { clearInterval(timerId); view = 'home'; ses = null; render(); }
  else if (a === 'home') { clearInterval(timerId); view = 'home'; render(); window.scrollTo(0, 0); }
  else if (a === 'filter') { ses.filter = b.dataset.f; render(); }
  else if (a === 'reset') { resetAsk = true; render(); }
  else if (a === 'reset-no') { resetAsk = false; render(); }
  else if (a === 'reset-yes') { DB = { stats: {}, exams: [], prefs: DB.prefs }; saveDB(); resetAsk = false; render(); }
});
document.addEventListener('change', (e) => {
  if (e.target.id === 'topic') cfg.topic = e.target.value;
  else if (e.target.id === 'optvideo') { DB.prefs.video = e.target.checked; saveDB(); render(); }
});
document.addEventListener('keydown', (e) => {
  if (view !== 'q' || e.target.tagName === 'SELECT') return;
  const k = e.key.toLowerCase();
  const m = { '1': 0, '2': 1, '3': 2, a: 0, b: 1, c: 2 };
  if (k in m) choose(m[k]);
  else if (k === 'enter' && e.target.tagName !== 'BUTTON') next();
});

render();
</script>

</body></html>
